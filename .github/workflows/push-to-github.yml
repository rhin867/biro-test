name: Sync to GitHub

on:
  push:
    branches:
      - main
      - 'edit/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Push to GitHub
        run: |
          if [ -z "$GH_REPO_URL" ]; then
            echo "::error::GH_REPO_URL secret is missing in Lovable settings."
            exit 1
          fi
          
          git remote add target "$GH_REPO_URL"
          git push target "HEAD:main" --force
        env:
          GH_REPO_URL: ${{ secrets.GH_REPO_URL }}
