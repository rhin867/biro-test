name: Sync to GitHub

on:
  push:
    branches:
      - main
      - 'edit/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Push to GitHub
        run: |
          if [ -z "$GH_REPO_URL" ]; then
            echo "::error::GH_REPO_URL secret is missing. Add it to GitHub Settings > Secrets > Actions."
            echo "Format: https://YOUR_TOKEN@github.com/rhin867/biro-test.git"
            exit 1
          fi
          
          echo "Setting up remote..."
          git remote add target "$GH_REPO_URL"
          
          echo "Pushing current branch: ${GITHUB_REF_NAME}..."
          git push target "HEAD:main" --force
        env:
          GH_REPO_URL: ${{ secrets.GH_REPO_URL }}
